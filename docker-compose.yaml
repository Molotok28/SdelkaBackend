services:
  sdelka-postgres:
    image: postgres:18.3-bookworm
    container_name: sdelka-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always

  sdelka-postgres-migrate:
    image: migrate/migrate:v4.19.1
    container_name: sdelka-migrate
    volumes:
      - ./migrations:/migrations

  sdelka-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: sdelka-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:sdelka-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"